<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account &middot; Market Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap narrow auth">
  <h1 class="page-title big">Create your account</h1>
  <p class="muted">Free, and always free for buyers.</p>
  <form class="card" id="form">
    <div class="field">
      <label class="lab" for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" required maxlength="60">
    </div>
    <div class="field">
      <label class="lab" for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label class="lab" for="password">Password</label>
      <div class="hint">At least 8 characters.</div>
      <input id="password" type="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="notice bad small" id="error" hidden></div>
    <button class="btn block" id="submit" type="submit">Create account</button>
  </form>
  <p class="center small">Selling instead? <a href="seller-setup.html">Start a farm profile</a></p>
</main>

<script type="module">
// Its own module on purpose. If the Firebase SDK fails to load, blocked by
// an ad blocker or a slow CDN, the page still has working navigation.
import { renderChrome } from "./chrome.js";
renderChrome();
</script>

<script type="module">
import { auth, db } from "./firebase.js";

import { createUserWithEmailAndPassword, deleteUser }
  from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// Bind elements explicitly. A bare `name` resolves to window.name, the built in
// string, not the input, so the profile was being written with name: undefined
// and Firestore rejected the whole document.
const $ = id => document.getElementById(id);
const nameEl = $("name"), emailEl = $("email"), passwordEl = $("password");

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("submit");
  const err = $("error");
  btn.disabled = true; err.hidden = true;

  let cred;
  try {
    cred = await createUserWithEmailAndPassword(auth, emailEl.value.trim(), passwordEl.value);
  } catch (ex) {
    console.error("signup failed:", ex.code, ex.message);
    err.textContent = AUTH_MESSAGES[ex.code] || `Could not create that account (${ex.code || "unknown"}).`;
    err.hidden = false;
    btn.disabled = false;
    return;
  }

  try {
    // role and suspended are fixed at creation. The rules stop anyone editing
    // their own role later, which is what keeps admin meaningful.
    await setDoc(doc(db, "users", cred.user.uid), {
      name: nameEl.value.trim(),
      email: emailEl.value.trim(),
      role: "member",
      suspended: false,
      createdAt: serverTimestamp()
    });
    location.href = sessionStorage.getItem("marketday.after_login") || "index.html";
  } catch (ex) {
    // The login exists but the profile did not save. Leaving it would block this
    // email forever with "already in use", so undo it and let them try again.
    console.error("profile write failed:", ex.code, ex.message);
    try { await deleteUser(cred.user); } catch (_) {}
    err.textContent = "Your account could not be finished saving, so nothing was created. Please try again.";
    err.hidden = false;
    btn.disabled = false;
  }
});

// Say what actually went wrong. A generic message sends people in circles.
const AUTH_MESSAGES = {
  "auth/email-already-in-use": "There is already an account with that email. Try logging in instead.",
  "auth/invalid-email": "That email address does not look right. Check for a typo.",
  "auth/weak-password": "That password is too easy to guess. Use at least 8 characters.",
  "auth/missing-password": "Enter a password.",
  "auth/operation-not-allowed": "Email sign up is switched off for this site. That is our problem, not yours.",
  "auth/network-request-failed": "We could not reach the server. Check your connection and try again.",
  "auth/too-many-requests": "Too many attempts just now. Wait a minute and try again."
};
</script>
</body>
</html>
